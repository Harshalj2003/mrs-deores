spring:
  application:
    name: mrs-deores-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    from: ${MAIL_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}
            required: false 
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}
            protocols: TLSv1.2
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  admin:
    secret-key: ${ADMIN_SECRET_KEY}
    master-key: ${ADMIN_MASTER_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  self-ping-url: ${SELF_PING_URL:https://mrsdeore-premix.onrender.com/health}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads/}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  media:
    max-file-size-mb: 10
    allowed-formats: jpg,jpeg,png,webp,mp4,pdf
  seed:
    admin-username: ${SEED_ADMIN_USERNAME:admin}
    admin-email: ${SEED_ADMIN_EMAIL:admin@mrsdeores.com}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMeNow123!}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
