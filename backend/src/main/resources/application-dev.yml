spring:
  flyway:
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins: http://localhost:5173,${FRONTEND_URL},https://*.ngrok-free.dev

logging:
  level:
    com.mrsdeores: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.mail: DEBUG
